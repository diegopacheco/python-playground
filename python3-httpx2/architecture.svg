<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="Caveat, 'Comic Sans MS', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');</style>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#fffdf7"/>
  <text x="490" y="34" text-anchor="middle" font-size="27" font-weight="700" fill="#3a3a3a">python3-httpx2 &#8212; how a request travels</text>

  <g filter="url(#wobble)" stroke-linecap="round">
    <rect x="90" y="60" width="210" height="66" rx="12" fill="#dbeafe" stroke="#3b6fb5" stroke-width="2.5"/>
    <rect x="430" y="60" width="250" height="66" rx="12" fill="#dbeafe" stroke="#3b6fb5" stroke-width="2.5"/>
    <rect x="120" y="196" width="330" height="78" rx="12" fill="#dcfce7" stroke="#3f8f5f" stroke-width="2.5"/>
    <rect x="645" y="196" width="278" height="78" rx="12" fill="#ede9fe" stroke="#7255b5" stroke-width="2.5"/>
    <rect x="120" y="344" width="330" height="72" rx="12" fill="#fef3c7" stroke="#b58a2b" stroke-width="2.5"/>
    <rect x="90" y="480" width="390" height="80" rx="12" fill="#fce7f3" stroke="#b5548a" stroke-width="2.5"/>
    <rect x="578" y="392" width="345" height="168" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>

    <path d="M195 126 L240 196" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M500 126 L400 196" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M620 126 L720 196" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M285 274 L285 344" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M285 416 L285 480" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M480 508 L580 480" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
  </g>

  <g text-anchor="middle" fill="#2f2f2f">
    <text x="195" y="90" font-size="22" font-weight="700">src/main.py</text>
    <text x="195" y="114" font-size="17" fill="#5a5a5a">test-client.sh</text>
    <text x="555" y="90" font-size="22" font-weight="700">tests/test_client.py</text>
    <text x="555" y="114" font-size="17" fill="#5a5a5a">test.sh &#183; pytest</text>

    <text x="285" y="226" font-size="22" font-weight="700">src/client.py</text>
    <text x="285" y="250" font-size="17" fill="#5a5a5a">httpx2.Client &#183; httpx2.AsyncClient</text>
    <text x="285" y="268" font-size="17" fill="#5a5a5a">base_url &#183; timeouts &#183; BasicAuth</text>

    <text x="784" y="226" font-size="20" font-weight="700">httpx2.MockTransport</text>
    <text x="784" y="250" font-size="17" fill="#5a5a5a">same client, no sockets</text>
    <text x="784" y="268" font-size="17" fill="#5a5a5a">handler returns a Response</text>

    <text x="285" y="374" font-size="22" font-weight="700">httpx2.HTTPTransport</text>
    <text x="285" y="399" font-size="17" fill="#5a5a5a">httpcore2 &#183; HTTP/1.1 &#183; pooled keep-alive</text>

    <text x="285" y="512" font-size="22" font-weight="700">src/server.py</text>
    <text x="285" y="536" font-size="17" fill="#5a5a5a">stdlib ThreadingHTTPServer</text>
    <text x="285" y="554" font-size="17" fill="#5a5a5a">127.0.0.1:8080 &#183; run.sh</text>
  </g>

  <g text-anchor="start" fill="#2f2f2f">
    <text x="606" y="424" font-size="21" font-weight="700">endpoints</text>
    <text x="606" y="452" font-size="17" fill="#5a5a5a">GET /health &#183; GET /users</text>
    <text x="606" y="476" font-size="17" fill="#5a5a5a">POST /echo</text>
    <text x="606" y="500" font-size="17" fill="#5a5a5a">QUERY /search</text>
    <text x="604" y="524" font-size="16" fill="#5a5a5a">GET /stream &#183; GET /events (SSE)</text>
    <text x="604" y="548" font-size="16" fill="#5a5a5a">GET /secure &#183; /status/{code} &#183; /delay</text>
  </g>
</svg>
