<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-label="QR page capture architecture">
  <defs>
    <filter id="wobble" x="-4%" y="-12%" width="108%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a3733"/>
    </marker>
  </defs>

  <style>
    .lbl { font-family: Caveat, "Comic Sans MS", "Segoe Print", cursive; font-size: 19px; fill: #26241f; }
    .sub { font-family: Caveat, "Comic Sans MS", "Segoe Print", cursive; font-size: 15px; fill: #6b6862; }
    .note { font-family: Caveat, "Comic Sans MS", "Segoe Print", cursive; font-size: 17px; fill: #8a8579; }
    .head { font-family: Caveat, "Comic Sans MS", "Segoe Print", cursive; font-size: 22px; fill: #c0552f; }
  </style>

  <g filter="url(#wobble)" fill="none" stroke="#3a3733" stroke-width="2" stroke-linecap="round">
    <text class="head" x="30" y="42">mint — image in, printable page out</text>

    <rect x="30" y="62" width="200" height="88" rx="12" fill="#e8f0fb" stroke="#5b7fb9"/>
    <text class="lbl" x="130" y="98" text-anchor="middle" stroke="none">Electron · Upload</text>
    <text class="sub" x="130" y="122" text-anchor="middle" stroke="none">drop an image</text>

    <rect x="270" y="62" width="200" height="88" rx="12" fill="#eaf6ec" stroke="#5f9b6d"/>
    <text class="lbl" x="370" y="98" text-anchor="middle" stroke="none">POST /uploads</text>
    <text class="sub" x="370" y="122" text-anchor="middle" stroke="none">HMAC id, 36 chars</text>

    <rect x="510" y="62" width="200" height="88" rx="12" fill="#fdf0e6" stroke="#c0552f"/>
    <text class="lbl" x="610" y="92" text-anchor="middle" stroke="none">segno v5 · EC-H</text>
    <text class="sub" x="610" y="114" text-anchor="middle" stroke="none">37 modules, painted</text>
    <text class="sub" x="610" y="133" text-anchor="middle" stroke="none">with your picture</text>

    <rect x="750" y="62" width="200" height="88" rx="12" fill="#f6ecfa" stroke="#8a5fa8"/>
    <text class="lbl" x="850" y="92" text-anchor="middle" stroke="none">verification gate</text>
    <text class="sub" x="850" y="114" text-anchor="middle" stroke="none">shrink to 1080p, blur,</text>
    <text class="sub" x="850" y="133" text-anchor="middle" stroke="none">decode or restyle</text>

    <rect x="990" y="62" width="200" height="88" rx="12" fill="#fdf6e0" stroke="#b79a3c"/>
    <text class="lbl" x="1090" y="98" text-anchor="middle" stroke="none">A4 page · 300 DPI</text>
    <text class="sub" x="1090" y="122" text-anchor="middle" stroke="none">code at 25 mm</text>

    <path d="M232 106 L266 106" marker-end="url(#tip)"/>
    <path d="M472 106 L506 106" marker-end="url(#tip)"/>
    <path d="M712 106 L746 106" marker-end="url(#tip)"/>
    <path d="M952 106 L986 106" marker-end="url(#tip)"/>

    <path d="M1090 152 L1090 200 Q1090 214 1076 214 L84 214 Q70 214 70 228 L70 306" marker-end="url(#tip)" stroke-dasharray="7 6"/>
    <text class="note" x="608" y="206" text-anchor="middle" stroke="none">print at 100% on matte paper</text>

    <text class="head" x="120" y="292">capture — one camera position</text>

    <rect x="30" y="312" width="200" height="88" rx="12" fill="#fdf6e0" stroke="#b79a3c"/>
    <text class="lbl" x="130" y="348" text-anchor="middle" stroke="none">paper or PDF</text>
    <text class="sub" x="130" y="372" text-anchor="middle" stroke="none">a single-frame channel</text>

    <rect x="270" y="312" width="200" height="88" rx="12" fill="#e8f0fb" stroke="#5b7fb9"/>
    <text class="lbl" x="370" y="342" text-anchor="middle" stroke="none">Electron · Scan</text>
    <text class="sub" x="370" y="364" text-anchor="middle" stroke="none">one frame holds the</text>
    <text class="sub" x="370" y="383" text-anchor="middle" stroke="none">code and the page</text>

    <rect x="510" y="312" width="200" height="88" rx="12" fill="#eaf6ec" stroke="#5f9b6d"/>
    <text class="lbl" x="610" y="348" text-anchor="middle" stroke="none">POST /captures</text>
    <text class="sub" x="610" y="372" text-anchor="middle" stroke="none">the whole frame</text>

    <rect x="750" y="312" width="200" height="88" rx="12" fill="#fdf0e6" stroke="#c0552f"/>
    <text class="lbl" x="850" y="342" text-anchor="middle" stroke="none">decode + verify</text>
    <text class="sub" x="850" y="364" text-anchor="middle" stroke="none">cv2 reads the id and</text>
    <text class="sub" x="850" y="383" text-anchor="middle" stroke="none">its four corners</text>

    <rect x="990" y="312" width="200" height="88" rx="12" fill="#f6ecfa" stroke="#8a5fa8"/>
    <text class="lbl" x="1090" y="342" text-anchor="middle" stroke="none">deskew + pair</text>
    <text class="sub" x="1090" y="364" text-anchor="middle" stroke="none">corners are fiducials</text>
    <text class="sub" x="1090" y="383" text-anchor="middle" stroke="none">of known geometry</text>

    <path d="M232 356 L266 356" marker-end="url(#tip)"/>
    <path d="M472 356 L506 356" marker-end="url(#tip)"/>
    <path d="M712 356 L746 356" marker-end="url(#tip)"/>
    <path d="M952 356 L986 356" marker-end="url(#tip)"/>

    <text class="note" x="30" y="452" stroke="none">the optical hop carries 36 characters of identity — HTTPS carries the megabytes</text>
    <text class="note" x="30" y="480" stroke="none">no animated QR, no fountain codes: paper shows exactly one frame, forever</text>
    <text class="note" x="30" y="508" stroke="none">the gate turns a print-and-reprint loop into an in-memory one</text>
  </g>
</svg>
