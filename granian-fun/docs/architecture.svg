<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1e1e1e; }
      .t { font-size: 24px; font-weight: 700; }
      .s { font-size: 17px; }
      .l { font-size: 16px; fill: #555; }
      .box { stroke: #1e1e1e; stroke-width: 2; filter: url(#wobble); }
      .arrow { stroke: #1e1e1e; stroke-width: 2; fill: none; marker-end: url(#head); filter: url(#wobble); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="360">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>

  <rect class="box" x="40" y="60" width="180" height="64" rx="12" fill="#d0ebff"/>
  <text class="t" x="130" y="88" text-anchor="middle">HTTP client</text>
  <text class="s" x="130" y="112" text-anchor="middle">JSON over HTTP</text>

  <rect class="box" x="360" y="60" width="180" height="64" rx="12" fill="#ffec99"/>
  <text class="t" x="450" y="88" text-anchor="middle">Granian</text>
  <text class="s" x="450" y="112" text-anchor="middle">Rust HTTP server</text>

  <rect class="box" x="680" y="60" width="180" height="64" rx="12" fill="#e5dbff"/>
  <text class="t" x="770" y="88" text-anchor="middle">main.app</text>
  <text class="s" x="770" y="112" text-anchor="middle">RSGI adapter</text>

  <rect class="box" x="680" y="240" width="180" height="64" rx="12" fill="#b2f2bb"/>
  <text class="t" x="770" y="268" text-anchor="middle">Router</text>
  <text class="s" x="770" y="292" text-anchor="middle">method + path match</text>

  <rect class="box" x="360" y="240" width="180" height="64" rx="12" fill="#ffd8a8"/>
  <text class="t" x="450" y="268" text-anchor="middle">TaskApi</text>
  <text class="s" x="450" y="292" text-anchor="middle">validate + respond</text>

  <rect class="box" x="40" y="240" width="180" height="64" rx="12" fill="#ffc9c9"/>
  <text class="t" x="130" y="268" text-anchor="middle">TaskStore</text>
  <text class="s" x="130" y="292" text-anchor="middle">in-memory dict</text>

  <path class="arrow" d="M224,92 L354,92"/>
  <text class="l" x="290" y="80" text-anchor="middle">request</text>

  <path class="arrow" d="M544,92 L674,92"/>
  <text class="l" x="610" y="80" text-anchor="middle">scope + protocol</text>

  <path class="arrow" d="M770,128 L770,234"/>
  <text class="l" x="782" y="186">Request</text>

  <path class="arrow" d="M676,272 L546,272"/>
  <text class="l" x="610" y="260" text-anchor="middle">handler call</text>

  <path class="arrow" d="M356,272 L226,272"/>
  <text class="l" x="290" y="260" text-anchor="middle">Draft / Task</text>
</svg>
