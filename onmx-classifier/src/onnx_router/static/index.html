<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONNX Model Router</title>
<style>
  :root { --bg:#f7f7fb; --card:#fff; --ink:#1d1d2b; --muted:#6b6b80; --line:#e4e4ee; --accent:#4f46e5; --warn:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width:880px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:26px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  textarea { width:100%; min-height:90px; padding:12px; border:1px solid var(--line); border-radius:8px; font:inherit; resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; cursor:pointer; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .chip { background:#eef; color:var(--accent); border:1px solid #dde; padding:6px 10px; border-radius:999px; font-size:13px; }
  .model { font-size:22px; font-weight:600; }
  .tag { display:inline-block; padding:2px 8px; border-radius:6px; background:#eef; color:var(--accent); font-size:13px; margin-left:8px; }
  .tag.fallback { background:#fef3c7; color:var(--warn); }
  .bar { display:grid; grid-template-columns:90px 1fr 60px; gap:10px; align-items:center; margin:6px 0; font-size:14px; }
  .track { background:var(--line); border-radius:6px; height:10px; overflow:hidden; }
  .fill { background:var(--accent); height:100%; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); }
  .muted { color:var(--muted); }
  .error { color:#b91c1c; }
</style>
</head>
<body>
<main>
  <h1>ONNX Model Router</h1>
  <p class="sub">A TF-IDF + logistic regression classifier running in onnxruntime picks the model for each prompt.</p>

  <section class="card">
    <textarea id="prompt" placeholder="Type a prompt">write a python function that parses a csv file</textarea>
    <div class="row">
      <button id="go">Route</button>
      <button class="chip" data-p="solve the equation 2x + 4 = 10">math</button>
      <button class="chip" data-p="write a haiku about the winter sea">creative</button>
      <button class="chip" data-p="how do I make cold brew coffee">general</button>
      <button class="chip" data-p="banana">unknown</button>
    </div>
  </section>

  <section class="card" id="result"><span class="muted">No prompt routed yet.</span></section>

  <section class="card">
    <table>
      <thead><tr><th>Label</th><th>Model</th></tr></thead>
      <tbody id="routes"></tbody>
    </table>
    <p class="muted" id="policy"></p>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);

  function renderDecision(d) {
    const tag = d.fallback
      ? `<span class="tag fallback">fallback: ${d.label} below threshold</span>`
      : `<span class="tag">${d.label}</span>`;
    const bars = Object.entries(d.scores)
      .sort((a, b) => b[1] - a[1])
      .map(([label, score]) => `<div class="bar"><span>${label}</span><div class="track"><div class="fill" style="width:${score * 100}%"></div></div><span>${(score * 100).toFixed(1)}%</span></div>`)
      .join("");
    $("result").innerHTML = `<div class="model">${d.model}${tag}</div><p class="muted">confidence ${(d.confidence * 100).toFixed(1)}%</p>${bars}`;
  }

  async function route() {
    const res = await fetch("/api/route", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: $("prompt").value }),
    });
    const body = await res.json();
    if (res.ok) renderDecision(body);
    else $("result").innerHTML = `<span class="error">${body.error}</span>`;
  }

  async function loadRoutes() {
    const body = await (await fetch("/api/routes")).json();
    $("routes").innerHTML = Object.entries(body.routes).map(([l, m]) => `<tr><td>${l}</td><td>${m}</td></tr>`).join("");
    $("policy").textContent = `Below ${Math.round(body.threshold * 100)}% confidence the prompt goes to ${body.default}.`;
  }

  $("go").addEventListener("click", route);
  document.querySelectorAll(".chip").forEach((chip) =>
    chip.addEventListener("click", () => { $("prompt").value = chip.dataset.p; route(); })
  );
  loadRoutes();
  route();
</script>
</body>
</html>
