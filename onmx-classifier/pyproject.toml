[project]
name = "onnx-router"
version = "0.1.0"
description = "ONNX text classifier that routes prompts to the right model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
]

[project.scripts]
onnx-router = "onnx_router.server:main"
onnx-router-train = "onnx_router.train:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "onnx>=1.23.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
