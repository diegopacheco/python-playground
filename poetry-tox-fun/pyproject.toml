[project]
name = "notes-app"
version = "0.1.0"
description = "Typed Python 3.15 notes web app on the standard library, built with Poetry and tested with tox"
requires-python = ">=3.13,<3.16"
dependencies = []

[project.scripts]
notes-app = "notes_app.__main__:main"

[dependency-groups]
dev = ["pytest>=9", "ty>=0.0.86"]

[build-system]
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "notes_app", from = "src" }]

[tool.ty.environment]
python-version = "3.13"
root = ["src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
