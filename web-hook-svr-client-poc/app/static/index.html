<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webhook Admin</title>
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e2da;
    --accent: #c2410c;
    --ok: #15803d;
    --ok-bg: #dcfce7;
    --bad: #b91c1c;
    --bad-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); background: var(--card); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; }
  h1 span { color: var(--accent); }
  .relay { font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--bad); }
  .dot.on { background: var(--ok); }
  main { max-width: 1680px; margin: 0 auto; padding: 20px 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .stat b { display: block; font-size: 24px; }
  .stat small { color: var(--muted); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filters .to { color: var(--accent); font-weight: 700; }
  .filters .gap { width: 12px; }
  .filters button.journey { background: #fff7ed; border-color: var(--accent); color: var(--accent); }
  .corr { font-family: ui-monospace, Menlo, monospace; color: #1d4ed8; border-bottom: 1px dashed #1d4ed8; cursor: pointer; }
  .corr:hover { color: var(--accent); border-color: var(--accent); }
  .corr-line { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .corr-line code { font-family: ui-monospace, Menlo, monospace; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .filters button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .filters button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .table { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tbody tr.event { cursor: pointer; }
  tbody tr.event:hover { background: #fbfaf7; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .type { font-family: ui-monospace, Menlo, monospace; color: var(--accent); }
  td.detail { white-space: normal; background: #fbfaf7; padding: 16px; }
  .flow { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .node { flex: 1 1 200px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .node b { display: block; font-size: 14px; }
  .node small { display: block; color: var(--muted); font-size: 12px; }
  .node.ok { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
  .node.bad { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
  .arrow { display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--accent); font-size: 12px; min-width: 70px; }
  .arrow span { font-size: 22px; line-height: 1; }
  .panels { display: grid; gap: 10px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .panel summary { cursor: pointer; padding: 10px 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .panel summary:hover { color: var(--ink); }
  .panel summary .count { color: var(--accent); text-transform: none; letter-spacing: 0; }
  .hops { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .hops .what { color: var(--ink); margin-right: 6px; }
  .hop { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; color: var(--ink); font-weight: 500; }
  .hops .to { color: var(--accent); font-weight: 700; }
  .panel .code { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; }
  .code { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; font: 13px/1.7 ui-monospace, Menlo, monospace; overflow-x: auto; padding: 10px 0; }
  .line { display: flex; width: max-content; min-width: 100%; }
  .ln { flex: 0 0 44px; padding-right: 12px; text-align: right; color: #a8a29e; user-select: none; }
  .src { white-space: pre; padding-right: 16px; }
  .j-key { color: #1d4ed8; }
  .j-str { color: #15803d; }
  .j-num { color: #c2410c; }
  .j-lit { color: #9333ea; }
  .j-punct { color: #6b7280; }
  .none { color: var(--muted); font-style: italic; padding: 8px 12px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Pre-built Houses <span>Webhook Admin</span></h1>
  <div class="relay"><span id="dot" class="dot"></span><span id="relay">checking listener</span></div>
</header>
<main>
  <section class="stats">
    <div class="stat"><b id="total">0</b><small>events received</small></div>
    <div class="stat"><b id="valid">0</b><small>valid signatures</small></div>
    <div class="stat"><b id="invalid">0</b><small>rejected signatures</small></div>
    <div class="stat"><b id="delivered">0</b><small>houses delivered</small></div>
  </section>
  <nav class="filters" id="filters"></nav>
  <div class="table">
    <table>
      <thead><tr><th>Received</th><th>Correlation ID</th><th>Event</th><th>Signature</th><th>House</th><th>Model</th><th>Lot</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">No webhooks received yet. Run ./scripts/generate-synthetical-data.sh</div>
  </div>
</main>
<script>
  const state = { events: [], deliveries: {}, filter: "all", correlation: null, open: new Set(), openPanels: new Set() };

  const element = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const JSON_TOKEN = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|([{}\[\],:])/g;

  const highlight = (text) => {
    const nodes = [];
    let last = 0;
    for (const match of text.matchAll(JSON_TOKEN)) {
      if (match.index > last) nodes.push(document.createTextNode(text.slice(last, match.index)));
      if (match[1] && match[2]) nodes.push(element("span", "j-key", match[1]), element("span", "j-punct", match[2]));
      else if (match[1]) nodes.push(element("span", "j-str", match[1]));
      else if (match[3]) nodes.push(element("span", "j-lit", match[3]));
      else if (match[4]) nodes.push(element("span", "j-num", match[4]));
      else nodes.push(element("span", "j-punct", match[5]));
      last = match.index + match[0].length;
    }
    if (last < text.length) nodes.push(document.createTextNode(text.slice(last)));
    return nodes;
  };

  const codeBlock = (value) => {
    const block = element("div", "code");
    JSON.stringify(value, null, 2).split("\n").forEach((text, index) => {
      const line = element("div", "line");
      const src = element("span", "src");
      src.append(...highlight(text));
      line.append(element("span", "ln", index + 1), src);
      block.appendChild(line);
    });
    return block;
  };

  const hops = (what, path) => {
    const label = element("span", "hops");
    label.appendChild(element("span", "what", what));
    path.forEach((name, index) => {
      if (index) label.appendChild(element("span", "to", "\u2192"));
      label.appendChild(element("span", "hop", name));
    });
    return label;
  };

  const panel = (key, what, path, unit, value) => {
    const section = element("details", "panel");
    section.open = state.openPanels.has(key);
    section.ontoggle = () => { section.open ? state.openPanels.add(key) : state.openPanels.delete(key); };
    const summary = element("summary");
    summary.append(hops(what, path), element("span", "count", value ? `${Object.keys(value).length} ${unit}` : "none"));
    section.appendChild(summary);
    if (value) section.appendChild(codeBlock(value));
    return section;
  };

  const time = (iso) => (iso ? new Date(iso).toISOString().slice(11, 23) : "-");

  const gap = (from, to) => (from && to ? `${new Date(to) - new Date(from)} ms` : "");

  const node = (title, subtitle, lines, status) => {
    const box = element("div", `node ${status}`);
    box.append(element("b", "", title), element("small", "", subtitle), ...lines.map((text) => element("small", "", text)));
    return box;
  };

  const arrow = (label) => {
    const box = element("div", "arrow");
    box.append(element("span", "", "\u2192"), element("div", "", label));
    return box;
  };

  const flow = (event, delivery) => {
    const box = element("div", "flow");
    box.append(
      delivery
        ? node("Webhook Server", "localhost:8081", [`sent ${time(delivery.sent_at)} UTC`, `relay answered HTTP ${delivery.relay_status}`], "ok")
        : node("Webhook Server", "localhost:8081", ["no record of sending this event", "forged or sent before a restart"], "bad"),
      arrow(gap(delivery && delivery.sent_at, event.relayed_at) || "POST"),
      node("smee.io", "public relay", [`relayed ${time(event.relayed_at)} UTC`, "pushed over SSE"], event.relayed_at ? "ok" : "bad"),
      arrow(gap(event.relayed_at, event.received_at) || "SSE"),
      node("Webhook Listener", "localhost:8082", [`received ${time(event.received_at)} UTC`, `signature ${event.signature_valid ? "valid" : "rejected"}`], event.signature_valid ? "ok" : "bad"),
    );
    return box;
  };

  const details = (event) => {
    const delivery = state.deliveries[event.id];
    const td = element("td", "detail");
    td.colSpan = 8;
    const line = element("p", "corr-line", "Correlation ID ");
    line.appendChild(element("code", "", event.correlation_id || "none"));
    const panels = element("div", "panels");
    panels.append(
      panel(`${event.id}:out`, "Out headers", ["Webhook Server", "smee.io"], "headers", delivery && delivery.headers),
      panel(`${event.id}:in`, "In headers", ["smee.io", "Webhook Listener"], "headers", event.headers),
      panel(`${event.id}:payload`, "Payload", ["Webhook Server", "smee.io", "Webhook Listener"], "fields", event.payload),
    );
    td.append(line, flow(event, delivery), panels);
    return td;
  };

  const cell = (text, className) => {
    const td = document.createElement("td");
    const span = document.createElement("span");
    span.textContent = text;
    if (className) span.className = className;
    td.appendChild(span);
    return td;
  };

  const houseOf = (event) => (event.payload.data && event.payload.data.house) || {};

  const LIFECYCLE = [
    ["house.ordered", "ordered"],
    ["house.status_changed", "in progress"],
    ["house.delivered", "delivered"],
  ];

  const inJourney = () => state.events.filter((event) => !state.correlation || event.correlation_id === state.correlation);

  const toggleJourney = (correlationId) => {
    state.correlation = state.correlation === correlationId ? null : correlationId;
    render();
  };

  const correlationCell = (event) => {
    const td = document.createElement("td");
    if (!event.correlation_id) return cell("-");
    const link = element("span", "corr", event.correlation_id.slice(0, 8));
    link.title = `${event.correlation_id}, click to show only this customer journey`;
    link.onclick = (click) => { click.stopPropagation(); toggleJourney(event.correlation_id); };
    td.appendChild(link);
    return td;
  };

  const filterButton = (type, label) => {
    const button = element("button", type === state.filter ? "active" : "");
    const scoped = inJourney();
    const count = type === "all" ? scoped.length : scoped.filter((event) => event.type === type).length;
    button.textContent = `${label} (${count})`;
    button.onclick = () => { state.filter = type; render(); };
    return button;
  };

  const renderFilters = () => {
    const known = LIFECYCLE.map(([type]) => type);
    const others = [...new Set(state.events.map((event) => event.type))].filter((type) => !known.includes(type));
    const chips = [filterButton("all", "all"), element("span", "gap")];
    LIFECYCLE.forEach(([type, label], index) => {
      if (index) chips.push(element("span", "to", "\u2192"));
      chips.push(filterButton(type, label));
    });
    others.forEach((type) => chips.push(element("span", "gap"), filterButton(type, type)));
    if (state.correlation) {
      const journey = element("button", "journey", `correlation ${state.correlation.slice(0, 8)} \u2715`);
      journey.title = "show every customer again";
      journey.onclick = () => toggleJourney(state.correlation);
      chips.push(element("span", "gap"), journey);
    }
    document.getElementById("filters").replaceChildren(...chips);
  };

  const renderRows = () => {
    const visible = inJourney().filter((event) => state.filter === "all" || event.type === state.filter);
    const rows = [];
    visible.forEach((event) => {
      const house = houseOf(event);
      const tr = document.createElement("tr");
      tr.className = "event";
      tr.append(
        cell(new Date(event.received_at).toLocaleTimeString()),
        correlationCell(event),
        cell(event.type, "type"),
        cell(event.signature_valid ? "valid" : "rejected", event.signature_valid ? "badge ok" : "badge bad"),
        cell((house.id || "-").slice(0, 8)),
        cell((house.model_details && house.model_details.name) || "-"),
        cell(house.lot || "-"),
        cell(house.status || "-"),
      );
      tr.onclick = () => { state.open.has(event.id) ? state.open.delete(event.id) : state.open.add(event.id); render(); };
      rows.push(tr);
      if (state.open.has(event.id)) {
        const detail = document.createElement("tr");
        detail.appendChild(details(event));
        rows.push(detail);
      }
    });
    document.getElementById("rows").replaceChildren(...rows);
    document.getElementById("empty").style.display = visible.length ? "none" : "block";
  };

  const renderStats = () => {
    const valid = state.events.filter((event) => event.signature_valid).length;
    document.getElementById("total").textContent = state.events.length;
    document.getElementById("valid").textContent = valid;
    document.getElementById("invalid").textContent = state.events.length - valid;
    document.getElementById("delivered").textContent = state.events.filter((event) => event.type === "house.delivered" && event.signature_valid).length;
  };

  const render = () => { renderStats(); renderFilters(); renderRows(); };

  const refresh = async () => {
    try {
      const [events, health, deliveries] = await Promise.all([
        fetch("/api/events").then((response) => response.json()),
        fetch("/health").then((response) => response.json()),
        fetch("/api/deliveries").then((response) => response.json()).catch(() => []),
      ]);
      state.events = Array.isArray(events) ? events : [];
      state.deliveries = Object.fromEntries((Array.isArray(deliveries) ? deliveries : []).map((delivery) => [delivery.id, delivery]));
      document.getElementById("dot").className = health.relay_connected ? "dot on" : "dot";
      document.getElementById("relay").textContent = health.relay_connected ? "listener connected to public relay" : "listener not connected to relay";
      render();
    } catch (error) {
      document.getElementById("dot").className = "dot";
      document.getElementById("relay").textContent = "listener unavailable";
    }
  };

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
