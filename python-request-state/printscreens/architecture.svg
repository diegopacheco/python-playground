<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text{font-family:'Caveat','Comic Sans MS',cursive;fill:#1e1e1e}</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2"/></marker>
  </defs>
  <rect width="1040" height="400" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1e1e1e" stroke-width="2.2">
    <rect x="30" y="140" width="150" height="90" rx="10" fill="#fff3bf"/>
    <rect x="240" y="40" width="760" height="300" rx="14" fill="none" stroke-dasharray="8 6"/>
    <rect x="270" y="140" width="160" height="90" rx="10" fill="#d0ebff"/>
    <rect x="470" y="140" width="150" height="90" rx="10" fill="#d3f9d8"/>
    <rect x="660" y="140" width="130" height="90" rx="10" fill="#e5dbff"/>
    <rect x="830" y="140" width="140" height="90" rx="10" fill="#ffd8a8"/>
    <rect x="255" y="262" width="190" height="56" rx="10" fill="#ffe3e3"/>
  </g>
  <g fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)" filter="url(#wobble)">
    <path d="M180 185 L262 185"/>
    <path d="M430 185 L462 185"/>
    <path d="M620 185 L652 185"/>
    <path d="M790 185 L822 185"/>
    <path d="M350 140 C350 95 900 95 900 132"/>
  </g>
  <text x="620" y="76" font-size="26" font-weight="700" text-anchor="middle">FastAPI app (uvicorn :8000, async)</text>
  <text x="105" y="180" font-size="26" font-weight="700" text-anchor="middle">Browser</text>
  <text x="105" y="208" font-size="20" text-anchor="middle">vanilla JS UI</text>
  <text x="350" y="180" font-size="26" font-weight="700" text-anchor="middle">Middleware</text>
  <text x="350" y="208" font-size="19" text-anchor="middle">fills request.state</text>
  <text x="545" y="180" font-size="26" font-weight="700" text-anchor="middle">Controller</text>
  <text x="545" y="208" font-size="19" text-anchor="middle">/api/games</text>
  <text x="725" y="180" font-size="26" font-weight="700" text-anchor="middle">Service</text>
  <text x="725" y="208" font-size="19" text-anchor="middle">uuid, rules</text>
  <text x="900" y="180" font-size="26" font-weight="700" text-anchor="middle">DAO</text>
  <text x="900" y="208" font-size="19" text-anchor="middle">aiosqlite SQL</text>
  <text x="350" y="297" font-size="18" text-anchor="middle">request_id + game_service</text>
  <text x="625" y="131" font-size="18" text-anchor="middle">one sqlite connection per request</text>
  <text x="900" y="275" font-size="24" font-weight="700" text-anchor="middle">games.db</text>
  <text x="900" y="300" font-size="19" text-anchor="middle">SQLite file</text>
  <path d="M900 230 L900 252" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M350 230 L350 256" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
