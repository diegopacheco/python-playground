<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Caveat, 'Comic Sans MS', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');</style>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect width="1000" height="680" fill="#fffdf7"/>
  <text x="500" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#3a3a3a">sql-alchemy-tx-management &#8212; where the transaction opens and closes</text>

  <g filter="url(#wobble)" stroke-linecap="round">
    <rect x="50" y="60" width="290" height="64" rx="12" fill="#dbeafe" stroke="#3b6fb5" stroke-width="2.5"/>
    <rect x="50" y="170" width="290" height="76" rx="12" fill="#dbeafe" stroke="#3b6fb5" stroke-width="2.5"/>
    <rect x="50" y="290" width="290" height="96" rx="12" fill="#dcfce7" stroke="#3f8f5f" stroke-width="2.5"/>
    <rect x="50" y="430" width="290" height="96" rx="12" fill="#fef3c7" stroke="#b58a2b" stroke-width="2.5"/>
    <rect x="460" y="250" width="490" height="250" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
    <rect x="50" y="570" width="900" height="76" rx="12" fill="#fce7f3" stroke="#b5548a" stroke-width="2.5"/>

    <path d="M195 124 L195 170" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M195 246 L195 290" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M195 386 L195 430" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M195 526 L195 570" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M340 320 L460 320" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M340 470 L460 470" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <path d="M705 500 L705 570" stroke="#6b6b6b" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
  </g>

  <g text-anchor="middle" fill="#2f2f2f">
    <text x="195" y="86" font-size="22" font-weight="700">curl &#183; httpx</text>
    <text x="195" y="110" font-size="16" fill="#5a5a5a">REST over HTTP</text>

    <text x="195" y="200" font-size="22" font-weight="700">controller.py</text>
    <text x="195" y="226" font-size="16" fill="#5a5a5a">thin FastAPI routes</text>

    <text x="195" y="320" font-size="22" font-weight="700">service.py</text>
    <text x="195" y="346" font-size="16" fill="#5a5a5a">every method @transactional</text>
    <text x="195" y="370" font-size="16" fill="#5a5a5a">transfer calls withdraw + deposit</text>

    <text x="195" y="460" font-size="22" font-weight="700">dao.py</text>
    <text x="195" y="486" font-size="16" fill="#5a5a5a">AccountDAO &#183; LedgerDAO</text>
    <text x="195" y="510" font-size="16" fill="#5a5a5a">current_session().flush()</text>

    <text x="400" y="308" font-size="15" fill="#5a5a5a">@transactional</text>
    <text x="400" y="458" font-size="15" fill="#5a5a5a">current_session()</text>
    <text x="830" y="542" font-size="17" fill="#5a5a5a">COMMIT or ROLLBACK</text>

    <text x="705" y="290" font-size="23" font-weight="700">tx.py</text>
    <text x="705" y="328" font-size="18" fill="#4a4a4a">ContextVar holds one AsyncSession per task</text>
    <text x="705" y="362" font-size="18" fill="#4a4a4a">already set? join the caller transaction</text>
    <text x="705" y="396" font-size="18" fill="#4a4a4a">not set? session_factory() + session.begin()</text>
    <text x="705" y="430" font-size="18" fill="#4a4a4a">method returns &#8594; COMMIT</text>
    <text x="705" y="464" font-size="18" fill="#4a4a4a">method raises &#8594; ROLLBACK</text>

    <text x="500" y="606" font-size="23" font-weight="700">PostgreSQL 18 in podman</text>
    <text x="500" y="632" font-size="17" fill="#5a5a5a">accounts &#183; ledger &#8212; one transaction per service call, nested calls included</text>
  </g>
</svg>
