[project]
name = "python-3-15-fun"
version = "0.1.0"
description = "Every Python 3.15 feature from the Astral release post, one typed file per feature"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.17", "ty"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
extend-select = ["TID254", "TID255", "RUF017", "TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-tidy-imports]
require-lazy = ["tomllib"]
ban-lazy = ["sys"]

[tool.ruff.lint.per-file-ignores]
"src/profiling_sampling.py" = ["RUF017"]

[tool.ty.environment]
root = ["src"]
