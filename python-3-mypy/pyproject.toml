[project]
name = "python-3-mypy"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.5",
    "pydantic>=2.11.9",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.13.1",
    "pytest>=8.4.2",
    "setuptools>=80.9.0",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^build/"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["library"]
