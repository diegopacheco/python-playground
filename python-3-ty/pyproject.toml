[project]
name = "python-3-ty"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "pydantic>=2.11",
]

[project.scripts]
library = "library.main:main"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "library"

[dependency-groups]
dev = [
    "ty",
    "ruff",
    "pytest",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "migrations"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
extend-exclude = ["broken"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
